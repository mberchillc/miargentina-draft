name: Deploy MIArgentina to its Cloudflare account

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publicar Con Sabor Argentino
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: miargentina-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          command: pages deploy . --project-name=miargentina-production --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the public episode feed
        shell: bash
        env:
          PRODUCTION_FEED_URL: https://miargentina.us/data/con-sabor-argentino.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const localFeed = JSON.parse(
            fs.readFileSync('data/con-sabor-argentino.json', 'utf8'),
          );
          const expectedVideoId = localFeed.episodes?.[0]?.videoId;

          if (!expectedVideoId) {
            throw new Error('The repository feed has no current episode to verify.');
          }

          const wait = (milliseconds) =>
            new Promise((resolve) => setTimeout(resolve, milliseconds));

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const verificationUrl = new URL(process.env.PRODUCTION_FEED_URL);
            verificationUrl.searchParams.set(
              'deployment_check',
              `${process.env.GITHUB_RUN_ID}-${attempt}`,
            );

            try {
              const response = await fetch(verificationUrl, {
                cache: 'no-store',
                headers: { 'cache-control': 'no-cache' },
              });
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }

              const publicFeed = await response.json();
              const publishedVideoId = publicFeed.episodes?.[0]?.videoId;
              if (publishedVideoId === expectedVideoId) {
                console.log(`Verified published episode ${expectedVideoId}.`);
                process.exit(0);
              }

              console.log(
                `Attempt ${attempt}: expected ${expectedVideoId}, found ${publishedVideoId || 'none'}.`,
              );
            } catch (error) {
              console.log(`Attempt ${attempt}: ${error.message}`);
            }

            if (attempt < 12) {
              await wait(5000);
            }
          }

          throw new Error(
            `Cloudflare deployment completed, but episode ${expectedVideoId} is not visible in production.`,
          );
          NODE
